<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CENTRAL-HEX-MD • Session</title>
  <style>
    :root {
      --bg: #000;
      --card: rgba(255,255,255,0.04);
      --stroke: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.70);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.12), transparent 55%),
                  radial-gradient(900px 500px at 10% 110%, rgba(255,255,255,0.08), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 28px));
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 26px 22px 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 90px rgba(0,0,0,0.65);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: conic-gradient(from 180deg, #fff, #444, #000, #444, #fff);
      opacity: 0.18;
      filter: blur(18px);
      animation: spin 9s linear infinite;
      z-index: -1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hero {
      width: 170px;
      height: 170px;
      border-radius: 999px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.06);
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 7px rgba(255,255,255,0.06);
      display: block;
      margin: 0 auto 14px;
      animation: floaty 3.6s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border-radius: 12px;
      text-decoration: none;
      color: #000;
      background: #fff;
      font-weight: 900;
      letter-spacing: 0.04em;
      border: 1px solid rgba(0,0,0,0.25);
      transition: transform .15s ease, opacity .15s ease;
      user-select: none;
    }

    a.btn.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.26);
    }

    a.btn:hover { transform: translateY(-1px); opacity: 0.96; }

    .meta {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.10);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(255,255,255,0.68);
      font-size: 12px;
    }

    .meta a { color: rgba(255,255,255,0.92); }
  </style>
</head>
<body>
  <div class="card">
    <img class="hero" src="https://files.catbox.moe/d58ulk.jpg" alt="CENTRAL-HEX" />
    <h1>CENTRAL-HEX-MD • Session</h1>
    <div class="subtitle">Interface noir & blanc • Multi-utilisateurs</div>

    <div class="grid">
      <a class="btn" href="/qr" target="_blank" rel="noopener">QR Code</a>
      <a class="btn" href="/pair" target="_blank" rel="noopener">Pairing Code</a>
      <a class="btn secondary" href="https://github.com/ibsacko59/CENTRAL-HEX" target="_blank" rel="noopener">GitHub</a>
      <a class="btn secondary" href="https://whatsapp.com/channel/0029VbC8YkY7oQhiOiiSpy1z" target="_blank" rel="noopener">Support WhatsApp</a>
    </div>

    <div class="meta">
      <div>Créateur : <strong>ibsacko</strong> • <a href="https://wa.me/224621963059" target="_blank" rel="noopener">224621963059</a></div>
      <div>© <span id="y"></span></div>
    </div>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
