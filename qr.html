<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CENTRAL-HEX-MD • QR</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --card: rgba(0,0,0,0.86);
      --stroke: rgba(255,255,255,0.18);
      --text: #fff;
      --muted: rgba(255,255,255,0.75);
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Outfit", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.12), transparent 55%),
                  radial-gradient(900px 500px at 10% 110%, rgba(255,255,255,0.08), transparent 55%),
                  var(--bg);
      color: var(--text);
      padding: 18px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.70);
    }

    img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #fff;
    }

    h2 { margin: 12px 0 6px; font-size: 18px; letter-spacing: 0.06em; }
    p { margin: 0 0 10px; color: var(--muted); }

    progress { width: 100%; height: 10px; border-radius: 999px; overflow: hidden; }

    .reload {
      margin-top: 10px;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid rgba(0,0,0,0.25);
    }
  </style>
  <script>
    let timeleft = 30;
    const t = setInterval(() => {
      const bar = document.getElementById('progressBar');
      if (!bar) return;
      if (timeleft <= 0) {
        clearInterval(t);
        bar.remove();
        document.getElementById('main').textContent = 'QR expiré — recharge la page';
        document.getElementById('legend').textContent = '';
        return;
      }
      bar.value = 30 - timeleft;
      timeleft -= 1;
    }, 1000);
  </script>
</head>
<body>
  <div class="card">
    <img id="qr-image" src="/server" alt="QR CODE">
    <h2 id="main">CENTRAL-HEX-MD • QR</h2>
    <p id="legend">Scanne le QR Code</p>
    <progress value="0" max="30" id="progressBar"></progress>
    <a class="reload" href="javascript:history.go(0)">Recharger</a>
  </div>
</body>
</html>
