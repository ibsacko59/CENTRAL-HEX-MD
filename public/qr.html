<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Code</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<h1>QR Code</h1>

<input id="number" placeholder="224XXXXXXXX">
<button class="btn" onclick="generateQR()">Générer QR</button>

<div id="qrbox" style="margin-top:15px;"></div>

<a href="/" class="btn">Retour</a>
</div>

<script>
async function generateQR(){
let number=document.getElementById("number").value;
let res=await fetch("/qr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});
let data=await res.json();
if(data.qr){
document.getElementById("qrbox").innerHTML=`<img src="${data.qr}" width="250">`;
}else{
document.getElementById("qrbox").innerText=data.error;
}
}
</script>

</body>
</html>
